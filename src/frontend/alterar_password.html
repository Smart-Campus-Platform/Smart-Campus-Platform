<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <title>Alterar Palavra-passe</title>
        <link rel="stylesheet" href="style2.css" />
    </head>
    <body>
        <div class="pagina">
            <header class="barracima">
                <button class="previous" type="button">⭠ Previous</button>
                <nav class = "icons">
                    <span>🔔</span>
                    <span>⚙️</span>
                    <span>👤</span>
                    <span>⌄</span>
                </nav>
            </header>
        
        <form>
            <div class="registar">
                <h1>Alterar Palavra-passe</h1>
                <div class="alterar">
                    <label>Password Nova:</label><br/>
                    <input name="password" type="password" placeholder="Introduza password nova"><br/>
                </div>
                <div class="alterar">
                    <label>Confirmar Password:</label><br/>
                    <input name="password" type="password" placeholder="Confirma password nova"><br/>
                </div>
                <button class="registo" type="submit">Alterar</button>
            </div>
        </form> 
        </div>
    </body>
</html>
