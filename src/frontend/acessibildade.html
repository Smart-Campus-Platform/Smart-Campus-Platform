
    <button id="botao-acessibilidade"
            aria-label="Opções de acessibilidade"
            title="Acessibilidade"
            aria-expanded="false"
            aria-controls="painel-acessibilidade">

    </button>
    <div id="painel-acessibilidade" role="dialog" aria-label="Painel de acessibilidade" aria-modal="false">
        <h4> Acessibilidade</h4>

        <div class="grupo-opcoes">
            <span class="titulo-grupo">Lupa / Tamanho (<span id="valor-zoom">50</span>)</span>
            <div class="linha-botoes">
                <input type="range" id="controlo-zoom"
                       min="0" max="100" value="50"
                       aria-label="Tamanho do texto"
                       aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
                       style="width:100%">
            </div>
        </div>

        <div class="grupo-opcoes">
            <span class="titulo-grupo">Daltonismo</span>
            <div class="linha-botoes">
                <button class="botao-opcao botao-filtro selecionado" data-filtro=""
                        aria-pressed="true"  title="Sem filtro">Normal</button>
                <button class="botao-opcao botao-filtro" data-filtro="filtro-protanopia"
                        aria-pressed="false" title="Protanopia — dificuldade com vermelho">Prot.</button>
                <button class="botao-opcao botao-filtro" data-filtro="filtro-deuteranopia"
                        aria-pressed="false" title="Deuteranopia — dificuldade com verde">Deut.</button>
                <button class="botao-opcao botao-filtro" data-filtro="filtro-tritanopia"
                        aria-pressed="false" title="Tritanopia — dificuldade com azul">Trit.</button>
            </div>
        </div>

        <div class="grupo-opcoes">
            <span class="titulo-grupo">Contraste</span>
            <div class="linha-botoes">
                <button class="botao-opcao" id="botao-contraste"
                        aria-pressed="false" title="Ativar / desativar alto contraste">
                    Alto Contraste
                </button>
                <button class="botao-opcao" id="botao-rosa"
                        aria-pressed="false" title="Ativar / desativar modo rosa">
                    Modo Rosa
                </button>
            </div>
        </div>
    </div>
    <script src="acessiblidade.js"></script>
