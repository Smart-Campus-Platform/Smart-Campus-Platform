<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login — Smart Campus</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <main>
            <form action="" method="post" aria-label="Formulário de autenticação">
                <div id="login">
                    <h1>Login</h1>
                    <div class="inputs">
                        <label for="email">Email:</label><br/>
                        <input id="email" name="email" type="email"
                               placeholder="Introduza email"
                               autocomplete="email"
                               aria-required="true"
                               aria-label="Endereço de email"><br/>
                    </div>
                    <div class="inputs">
                        <label for="password">Password:</label><br/>
                        <input id="password" name="password" type="password"
                               placeholder="Introduza password"
                               autocomplete="current-password"
                               aria-required="true"
                               aria-label="Palavra-passe"><br/>
                    </div>
                    <button type="submit" aria-label="Entrar na plataforma">Entrar</button>
                </div>
            </form>
        </main>
    </body>

</html>
