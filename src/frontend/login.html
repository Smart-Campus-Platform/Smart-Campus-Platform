<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Página de teste</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <form action="" method="post">
            <div id="login">
                <h1>Login</h1>
                <div class="inputs">
                    <label>Email:</label><br/>
                    <input name="email" type="email" placeholder="Introduza email"><br/>
                </div>
                <div class="inputs">
                    <label>Password:</label><br/>
                    <input name="password" type="password" placeholder="Introduza password"><br/>
                </div>
                <button type="submit">Entrar</button>
            </div>  
        </form>
    </body>

</html>
