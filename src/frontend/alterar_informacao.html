<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <title>Informações de Perfil</title>
        <link rel="stylesheet" href="style2.css" />
    </head>
    <body>
        <div class="pagina">
            <header class="barracima">
                <button class="previous" type="button">⭠ Previous</button>
                <nav class = "icons">
                    <span>🔔</span>
                    <span>⚙️</span>
                    <span>👤</span>
                    <span>⌄</span>
                </nav>
            </header>
        
        <form>
            <div class="registar">
                <h1>Informações de Perfil</h1>
                <div class="info">
                    <label>Email:</label><br/>
                    <input name="email" type="email" placeholder="Introduza email"><br/>
                </div>
                <div class="info">
                    <label>Contacto:</label><br/>
                    <input name="contacto" type="text" placeholder="Introduza contacto"><br/>
                </div>
                <div class="info">
                    <label>Descrição:</label><br/>
                    <textarea name="descricao"></textarea><br/>
                </div>
                <br/>
                <button class="registo" type="submit">Guardar Alterações</button>
            </div>
        </form> 
        </div>
    </body>
</html>
